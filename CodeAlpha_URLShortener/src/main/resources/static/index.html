<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>URL Shortener - CodeAlpha</title>
<style>
  :root{--bg:#f5f6fa;--card:#fff;--text:#1f2430;--muted:#6b7280;--accent:#4f46e5;--border:#e5e7eb}
  @media (prefers-color-scheme:dark){:root{--bg:#12141a;--card:#1b1e27;--text:#e8eaf0;--muted:#9aa1b2;--accent:#818cf8;--border:#2a2e3a}}
  body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text)}
  main{max-width:820px;margin:0 auto;padding:32px 16px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px}
  input{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin:6px 0 12px}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 18px;cursor:pointer;font-size:15px}
  button.link{background:none;color:var(--accent);padding:2px 6px}
  table{width:100%;border-collapse:collapse;font-size:14px} td,th{padding:8px;border-bottom:1px solid var(--border);text-align:left;word-break:break-all}
  .err{color:#dc2626}.ok a{color:var(--accent);font-weight:600}.wrap{overflow-x:auto}
</style>
</head>
<body><main>
<h1>URL Shortener</h1>
<div class="card">
  <label>Long URL</label><input id="url" placeholder="https://example.com/very/long/link">
  <label>Custom alias (optional)</label><input id="alias" placeholder="my-link">
  <button id="go">Shorten</button>
  <p id="msg"></p>
</div>
<div class="card"><h3>Recent links</h3><div class="wrap">
  <table><thead><tr><th>Short</th><th>Original</th><th>Clicks</th><th></th></tr></thead><tbody id="rows"></tbody></table>
</div></div>
<script>
const $=id=>document.getElementById(id);
async function load(){
  const list=await (await fetch('/api/urls')).json(); $('rows').innerHTML='';
  list.forEach(u=>{
    const tr=document.createElement('tr');
    const a=document.createElement('a'); a.href=u.shortUrl; a.target='_blank'; a.textContent=u.shortUrl;
    const td1=document.createElement('td'); td1.appendChild(a);
    const td2=document.createElement('td'); td2.textContent=u.originalUrl;
    const td3=document.createElement('td'); td3.textContent=u.clicks;
    const td4=document.createElement('td'); const b=document.createElement('button'); b.className='link'; b.textContent='Delete';
    b.onclick=async()=>{await fetch('/api/urls/'+u.shortCode,{method:'DELETE'});load();}; td4.appendChild(b);
    tr.append(td1,td2,td3,td4); $('rows').appendChild(tr);
  });
}
$('go').onclick=async()=>{
  const msg=$('msg'); msg.className=''; msg.textContent='';
  const r=await fetch('/api/shorten',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({url:$('url').value,alias:$('alias').value||null})});
  const d=await r.json();
  if(!r.ok){msg.className='err';msg.textContent=d.error;return;}
  msg.className='ok'; msg.textContent='Short URL: ';
  const a=document.createElement('a'); a.href=d.shortUrl; a.target='_blank'; a.textContent=d.shortUrl; msg.appendChild(a);
  load();
};
load();
</script>
</main></body></html>
